    <main>
        <div class="login-container">
            <!-- Sekmeler -->
            <div class="tab-container">
                <div class="tab active" id="market-owner-tab">Market Owner</div>
                <div class="tab" id="customer-tab">Customer</div>
            </div>
    
            <!-- Market Owner Formu -->
            <form id="market-owner-form" class="active" action="login.php" method="POST">
                <h2>Market Owner Login</h2>
                <div class="form-group">
                    <label for="market-owner-username">Username</label>
                    <input type="text" id="market-owner-username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="market-owner-password">Password</label>
                    <input type="password" id="market-owner-password" name="password" required>
                </div>
                <button type="submit" class="btn">Login as Market Owner</button>
            </form>
    
            <!-- Customer Formu -->
            <form id="customer-form" action="login.php" method="POST">
                <h2>Customer Login</h2>
                <div class="form-group">
                    <label for="customer-username">Username</label>
                    <input type="text" id="customer-username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="customer-password">Password</label>
                    <input type="password" id="customer-password" name="password" required>
                </div>
                <button type="submit" class="btn">Login as Customer</button>
            </form>
    
            <p>Don't have an account? <a href="register.html">Register here</a></p>
        </div>
